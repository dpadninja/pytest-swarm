[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-swarm"
version = "0.1.4"
description = "Run parametrized test variants in parallel threads — with correct fixture lifecycle"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["pytest>=7.0"]

[project.urls]
homepage = "https://github.com/dpadninja/pytest-swarm"
repository = "https://github.com/dpadninja/pytest-swarm"
issues = "https://github.com/dpadninja/pytest-swarm/issues"

[project.entry-points."pytest11"]
pytest-swarm = "pytest_swarm.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "pytester"]

