[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-swarm"
dynamic = ["version"]
description = "Run parametrized test variants in parallel threads — with correct fixture lifecycle"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["pytest>=7.0"]

[project.entry-points."pytest11"]
pytest-swarm = "pytest_swarm.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "pytester"]
